<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenador de Vocabulario Inglés</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; padding: 1.5rem 1rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 1.25rem; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: #fff; border: 0.5px solid #ddd; border-radius: 8px; padding: 5px 13px; font-size: 13px; color: #555; }
  .stat span { font-weight: 500; color: #1a1a18; }
  .mode-bar, .category-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 0.85rem; }
  .mode-btn, .cat-btn { padding: 5px 14px; border-radius: 20px; border: 0.5px solid #ccc; background: transparent; font-size: 13px; cursor: pointer; color: #555; transition: all 0.15s; }
  .mode-btn.active, .cat-btn.active { background: #1a1a18; color: #fff; border-color: #1a1a18; }
  .progress-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; overflow: hidden; margin-bottom: 1.25rem; }
  .progress-fill { height: 100%; background: #1a1a18; border-radius: 2px; transition: width 0.3s; }
  .card-area { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .flashcard { width: 100%; max-width: 520px; min-height: 200px; background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 2.5rem 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card-category { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
  .card-word { font-size: 30px; font-weight: 500; color: #1a1a18; margin-bottom: 0.4rem; }
  .card-hint { font-size: 13px; color: #888; }
  .card-emoji { font-size: 38px; margin-bottom: 0.6rem; }
  .input-row { width: 100%; max-width: 520px; display: flex; gap: 8px; }
  .input-row input { flex: 1; font-size: 16px; border: 0.5px solid #ccc; border-radius: 8px; padding: 0 14px; height: 44px; background: #fff; color: #1a1a18; outline: none; transition: border-color 0.15s; }
  .input-row input:focus { border-color: #888; }
  .input-row input.correct { border-color: #1D9E75; background: #E1F5EE; color: #085041; }
  .input-row input.wrong { border-color: #D85A30; background: #FAECE7; color: #4A1B0C; }
  .btn-check { padding: 0 20px; height: 44px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a18; font-size: 15px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .btn-check:hover { background: #f0f0f0; }
  .feedback { width: 100%; max-width: 520px; min-height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 15px; gap: 8px; }
  .feedback.correct { background: #E1F5EE; color: #085041; }
  .feedback.wrong { background: #FAECE7; color: #4A1B0C; }
  .feedback.hidden { visibility: hidden; }
  .next-btn { padding: 7px 16px; border-radius: 8px; border: 0.5px solid currentColor; background: transparent; color: inherit; font-size: 13px; cursor: pointer; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 520px; }
  .choice-btn { padding: 12px 16px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; color: #1a1a18; font-size: 15px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .choice-btn:hover { background: #f5f4f0; }
  .choice-btn.correct { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .choice-btn.wrong { background: #FAECE7; border-color: #D85A30; color: #4A1B0C; }
  .container { max-width: 680px; margin: 0 auto; }
  .section-lab{ font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>Vocabulario Inglés 🇬🇧</h1>

  <div class="top-bar">
    <div class="stats">
      <div class="stat">✅ <span id="score-correct">0</span> correctas</div>
      <div class="stat">❌ <span id="score-wrong">0</span> errores</div>
      <div class="stat">🔥 Racha: <span id="streak">0</span></div>
      <div class="stat">📊 Total: <span id="total-count">0</span> palabras</div>
    </div>
  </div>

  <div class="section-label">Modo</div>
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('write')" id="mode-write">✏️ Escribe (ES→EN)</button>
    <button class="mode-btn" onclick="setMode('choice')" id="mode-choice">🔤 Opción múltiple</button>
    <button class="mode-btn" onclick="setMode('reverse')" id="mode-reverse">🔄 Inglés→Español</button>
    <button class="mode-btn" onclick="setMode('tenses')" id="mode-tenses">⏳ Tiempos verbales</button>
  </div>

  <div class="section-label">Categoría</div>
  <div class="category-bar" id="cat-bar"></div>

  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <div class="card-area">
    <div class="flashcard" id="flashcard">
      <div class="card-emoji" id="card-emoji">🌟</div>
      <div class="card-category" id="card-cat"></div>
      <div class="card-word" id="card-word">Cargando...</div>
      <div class="card-hint" id="card-hint"></div>
    </div>
    <div class="input-row" id="write-area">
      <input type="text" id="answer-input" placeholder="Escribe traducción..." autocomplete="off" onkeydown="handleKey(event)" />
      <button class="btn-check" onclick="checkAnswer()">Verificar</button>
    </div>
    <div class="choices" id="choices-area" style="display:none"></div>
    <div id="tenses-area" style="width:100%; max-width:520px; flex-direction:column; gap:10px; display:none;">
      <div style="font-size:13px; color:#555; margin-bottom:2px;">Escribe las 3 formas del verbo:</div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:12px; color:#888; min-width:115px; flex-shrink:0;">Base (infinitive)</span>
        <input type="text" id="t-base" placeholder="base form..." autocomplete="off" onkeydown="handleTenseKey(event,0)" style="flex:1; font-size:15px; border:0.5px solid #ccc; border-radius:8px; padding:0 12px; height:40px; background:#fff; color:#1a1a18; outline:none;" />
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:12px; color:#888; min-width:115px; flex-shrink:0;">Simple past</span>
        <input type="text" id="t-past" placeholder="simple past..." autocomplete="off" onkeydown="handleTenseKey(event,1)" style="flex:1; font-size:15px; border:0.5px solid #ccc; border-radius:8px; padding:0 12px; height:40px; background:#fff; color:#1a1a18; outline:none;" />
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:12px; color:#888; min-width:115px; flex-shrink:0;">Past participle</span>
        <input type="text" id="t-pp" placeholder="past participle..." autocomplete="off" onkeydown="handleTenseKey(event,2)" style="flex:1; font-size:15px; border:0.5px solid #ccc; border-radius:8px; padding:0 12px; height:40px; background:#fff; color:#1a1a18; outline:none;" />
      </div>
      <button class="btn-check" onclick="checkTenses()" style="align-self:flex-start; padding:0 24px; height:40px;">Verificar</button>
    </div>
    <div class="feedback hidden" id="feedback">
      <span id="feedback-text"></span>
      <button class="next-btn" onclick="nextCard()">Siguiente →</button>
    </div>
  </div>
</div>

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + m).classList.add('active');
  // In tenses mode, only show verbs that have past/pp
  if (m === 'tenses') {
    const verbsWithTenses = ALL_WORDS.filter(w => w.past && (activeCat === 'Todas' || w.cat === activeCat));
    if (verbsWithTenses.length === 0) {
      // If current category has no verbs, switch to Todas
      activeCat = 'Todas';
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'Todas'));
    }
  }
  buildDeck();
  showCard();
}

function setCat(c) {
  activeCat = c;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === c));
  buildDeck();
  showCard();
}

function buildDeck() {
  let pool = ALL_WORDS.filter(w => activeCat === 'Todas' || w.cat === activeCat);
  if (mode === 'tenses') pool = pool.filter(w => w.past);
  deck = pool;
  shuffle(deck);
  seen = 0;
}

function showCard() {
  if (deck.length === 0) buildDeck();
  if (deck.length === 0) return;
  current = deck[seen % deck.length];
  seen++;
  answered = false;

  document.getElementById('card-emoji').textContent = current.emoji;

  const writeArea  = document.getElementById('write-area');
  const choicesArea = document.getElementById('choices-area');
  const tensesArea  = document.getElementById('tenses-area');
  const fb = document.getElementById('feedback');
  fb.className = 'feedback hidden';

  if (mode === 'tenses') {
    // Show Spanish verb, ask for base / simple past / past participle
    document.getElementById('card-cat').textContent = current.cat + ' — Tiempos verbales';
    document.getElementById('card-word').textContent = current.es;
    document.getElementById('card-hint').textContent = '¿Cuáles son las 3 formas en inglés?';
    writeArea.style.display   = 'none';
    choicesArea.style.display = 'none';
    tensesArea.style.display  = 'flex';
    ['t-base','t-past','t-pp'].forEach(id => {
      const inp = document.getElementById(id);
      inp.value = '';
      inp.style.borderColor = '#ccc';
      inp.style.background  = '#fff';
      inp.style.color       = '#1a1a18';
      inp.disabled = false;
    });
    setTimeout(() => document.getElementById('t-base').focus(), 50);

  } else {
    tensesArea.style.display = 'none';
    const isReverse = mode === 'reverse';
    document.getElementById('card-cat').textContent  = current.cat;
    document.getElementById('card-word').textContent = isReverse ? current.en : current.es;
    document.getElementById('card-hint').textContent = isReverse
      ? 'Traduce al español'
      : (mode === 'write' ? 'Escribe traducción en inglés' : 'Elige traducción en inglés');

    if (mode === 'write' || mode === 'reverse') {
      writeArea.style.display   = 'flex';
      choicesArea.style.display = 'none';
      const inp = document.getElementById('answer-input');
      inp.value = ''; inp.className = ''; inp.disabled = false;
      setTimeout(() => inp.focus(), 50);
    } else {
      writeArea.style.display   = 'none';
      choicesArea.style.display = 'grid';
      buildChoices();
    }
  }

  const pct = Math.min(100, Math.round((seen / Math.max(1, deck.length)) * 100));
  document.getElementById('prog').style.width = pct + '%';
}

function buildChoices() {
  const area = document.getElementById('choices-area');
  area.innerHTML = '';
  const correctVal = mode === 'reverse' ? current.es : current.en;
  const pool = ALL_WORDS
    .filter(w => w !== current && (activeCat === 'Todas' || w.cat === activeCat))
    .sort(() => Math.random() - 0.5)
    .slice(0, 3)
    .map(w => mode === 'reverse' ? w.es : w.en);
  const opts = [correctVal, ...pool].sort(() => Math.random() - 0.5);
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => checkChoice(btn, opt, correctVal);
    area.appendChild(btn);
  });
}

function checkChoice(btn, selected, correctVal) {
  if (answered) return;
  answered = true;
  const isRight = normalize(selected) === normalize(correctVal);
  document.querySelectorAll('.choice-btn').forEach(b => {
    if (normalize(b.textContent) === normalize(correctVal)) b.classList.add('correct');
    else if (b === btn && !isRight) b.classList.add('wrong');
    b.disabled = true;
  });
  updateScore(isRight);
  showFeedback(isRight, correctVal);
}

function normalize(s) {
  return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function checkAnswer() {
  if (answered) { nextCard(); return; }
  const inp = document.getElementById('answer-input');
  const val = inp.value;
  if (!val.trim()) return;
  answered = true;
  const correctVal = mode === 'reverse' ? current.es : current.en;
  const isRight = normalize(val) === normalize(correctVal);
  inp.className = isRight ? 'correct' : 'wrong';
  inp.disabled = true;
  updateScore(isRight);
  showFeedback(isRight, correctVal);
}

function checkTenses() {
  if (answered) { nextCard(); return; }
  answered = true;
  const fields = [
    { id: 't-base', correct: current.en },
    { id: 't-past', correct: current.past },
    { id: 't-pp',   correct: current.pp }
  ];
  let allRight = true;
  fields.forEach(f => {
    const inp = document.getElementById(f.id);
    const ok = normalize(inp.value) === normalize(f.correct);
    if (!ok) allRight = false;
    inp.style.borderColor = ok ? '#1D9E75' : '#D85A30';
    inp.style.background  = ok ? '#E1F5EE' : '#FAECE7';
    inp.style.color       = ok ? '#085041'  : '#4A1B0C';
    inp.disabled = true;
  });
  updateScore(allRight);
  // Show full answer in feedback
  const fb = document.getElementById('feedback');
  const ft = document.getElementById('feedback-text');
  if (allRight) {
    fb.className = 'feedback correct';
    const msgs = ['Excelente! 🎉', 'Correcto! ✅', 'Muy bien! 👏', 'Perfecto! 🌟', 'Genial! 💪'];
    ft.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  } else {
    fb.className = 'feedback wrong';
    ft.textContent = current.en + ' → ' + current.past + ' → ' + current.pp;
  }
}

function handleTenseKey(e, fieldIndex) {
  if (e.key === 'Enter') {
    if (answered) { nextCard(); return; }
    const ids = ['t-base','t-past','t-pp'];
    if (fieldIndex < ids.length - 1) {
      document.getElementById(ids[fieldIndex + 1]).focus();
    } else {
      checkTenses();
    }
  }
}

function updateScore(isRight) {
  if (isRight) { correct++; streak++; }
  else { wrong++; streak = 0; }
  document.getElementById('score-correct').textContent = correct;
  document.getElementById('score-wrong').textContent = wrong;
  document.getElementById('streak').textContent = streak;
}

function showFeedback(isRight, correctVal) {
  const fb = document.getElementById('feedback');
  const ft = document.getElementById('feedback-text');
  if (isRight) {
    fb.className = 'feedback correct';
    const msgs = ['Excelente! 🎉', 'Correcto! ✅', 'Muy bien! 👏', 'Perfecto! 🌟', 'Genial! 💪'];
    ft.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  } else {
    fb.className = 'feedback wrong';
    ft.textContent = 'Respuesta correcta: ' + correctVal;
  }
}

function nextCard() { showCard(); }

function handleKey(e) {
  if (e.key === 'Enter') {
    if (answered) nextCard();
    else checkAnswer();
  }
}

function buildCatBar() {
  const bar = document.getElementById('cat-bar');
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (c === 'Todas' ? ' active' : '');
    btn.dataset.cat = c;
    btn.textContent = c;
    btn.onclick = () => setCat(c);
    bar.appendChild(btn);
  });
}

buildCatBar();
buildDeck();
showCard();
</script>
</body>
</html>
